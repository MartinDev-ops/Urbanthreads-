<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wishlist — Urban Threads</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>
<body>

  <!-- ============ Navbar ============ -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="brand">URBAN THREADS</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li data-auth="in"><a href="wishlist.html" class="active">Wishlist</a></li>
        <li data-auth="in"><a href="orders.html">Orders</a></li>
      </ul>
      <div class="nav-right">
        <button id="profile-toggle" class="icon-btn profile-btn" data-auth="in" aria-label="Open user profile" aria-expanded="false" style="display:none;">
          <i class="bi bi-person-circle"></i>
        </button>
        <div id="user-menu" class="user-menu" aria-hidden="true">
          <div class="user-menu-card">
            <div class="user-menu-header">
              <span>Profile</span>
              <button id="user-menu-close" class="icon-btn" aria-label="Close profile menu"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="user-menu-details">
              <div class="user-menu-row">
                <span class="menu-label">Name</span>
                <span id="menu-user-name"></span>
              </div>
              <div class="user-menu-row">
                <span class="menu-label">Email</span>
                <span id="menu-user-email"></span>
              </div>
              <div class="user-menu-row">
                <span class="menu-label">Login method</span>
                <span id="menu-auth-method"></span>
              </div>
              <div class="user-menu-row password-row" style="display:none;">
                <span class="menu-label">Password</span>
                <span>••••••••</span>
              </div>
            </div>
            <button id="logout-btn" data-auth="in" class="btn btn-outline btn-sm user-menu-logout" style="display:none;">Log Out</button>
          </div>
        </div>
        <a href="login.html" data-auth="out" class="btn btn-outline btn-sm">Log In</a>
        <a href="cart.html" class="icon-btn cart-badge" title="Cart">
          <i class="bi bi-cart3"></i>
          <span id="cart-count" class="count" style="display:none;"></span>
        </a>
        <button id="nav-toggle" class="nav-toggle" aria-label="Menu"><i class="bi bi-list"></i></button>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <h1>Your Wishlist</h1>
    </div>
  </header>

  <main class="container">
    <div id="loading" class="spinner"></div>
    <div id="wishlist-grid" class="product-grid"></div>
    <div id="empty-wishlist" class="empty-state" style="display:none;">
      Nothing saved yet. <a href="shop.html">Browse the shop →</a> and tap the heart on anything you love.
    </div>
  </main>

  <footer>
    <div class="container">&copy; <span id="year"></span> Urban Threads.</div>
  </footer>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/wishlist.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
