<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Cart — Urban Threads</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>
<body>

  <!-- ============ Navbar ============ -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="brand">URBAN THREADS</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li data-auth="in"><a href="wishlist.html">Wishlist</a></li>
        <li data-auth="in"><a href="orders.html">Orders</a></li>
      </ul>
      <div class="nav-right">
        <span id="user-chip" class="user-chip" data-auth="in" style="display:none;"></span>
        <a href="login.html" data-auth="out" class="btn btn-outline btn-sm">Log In</a>
        <button id="logout-btn" data-auth="in" class="btn btn-outline btn-sm" style="display:none;">Log Out</button>
        <a href="cart.html" class="icon-btn cart-badge" title="Cart">
          <i class="bi bi-cart3"></i>
          <span id="cart-count" class="count" style="display:none;"></span>
        </a>
        <button id="nav-toggle" class="nav-toggle" aria-label="Menu"><i class="bi bi-list"></i></button>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <h1>Your Cart</h1>
    </div>
  </header>

  <main class="container">
    <div id="loading" class="spinner"></div>

    <div id="cart-content" style="display:none;">
      <div class="cart-layout">
        <div>
          <div id="cart-items" class="cart-items"></div>
          <div id="empty-cart" class="empty-state" style="display:none;">
            Your cart is empty. <a href="shop.html">Go find something you like →</a>
          </div>
        </div>

        <aside class="summary-card">
          <h2>Order Summary</h2>
          <div class="summary-row">
            <span>Items</span>
            <span id="summary-count">0</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span id="summary-total">$0.00</span>
          </div>
          <button id="checkout-btn" class="btn btn-primary btn-block" style="margin-top:16px;" disabled>
            Checkout
          </button>
          <p id="checkout-msg" class="form-msg" style="margin-top:12px;"></p>
        </aside>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">&copy; <span id="year"></span> Urban Threads.</div>
  </footer>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/cart.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
