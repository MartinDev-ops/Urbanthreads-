<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In or Sign Up — Urban Threads</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>
<body>

  <!-- ============ Navbar ============ -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="brand">URBAN THREADS</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li data-auth="in"><a href="wishlist.html">Wishlist</a></li>
        <li data-auth="in"><a href="orders.html">Orders</a></li>
      </ul>
      <div class="nav-right">
        <span id="user-chip" class="user-chip" data-auth="in" style="display:none;"></span>
        <a href="login.html" data-auth="out" class="btn btn-outline btn-sm active">Log In</a>
        <button id="logout-btn" data-auth="in" class="btn btn-outline btn-sm" style="display:none;">Log Out</button>
        <a href="cart.html" class="icon-btn cart-badge" title="Cart">
          <i class="bi bi-cart3"></i>
          <span id="cart-count" class="count" style="display:none;"></span>
        </a>
        <button id="nav-toggle" class="nav-toggle" aria-label="Menu"><i class="bi bi-list"></i></button>
      </div>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1 id="form-title">Welcome back</h1>
      <p class="sub" id="form-sub">Log in to your Urban Threads account.</p>

      <div id="form-msg" class="form-msg"></div>

      <form id="auth-form">
        <div class="field" id="name-field" style="display:none;">
          <label for="name">Full name</label>
          <input type="text" id="name" autocomplete="name" placeholder="Jordan Smith" />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required placeholder="you@example.com" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters" />
        </div>

        <div class="field" id="confirm-field" style="display:none;">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" autocomplete="new-password" minlength="6" placeholder="Re-enter password" />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Log In</button>
      </form>

      <div class="divider">or</div>

      <button id="google-btn" class="btn btn-outline btn-block">
        <i class="bi bi-google"></i> Continue with Google
      </button>

      <p class="auth-toggle">
        <span id="toggle-text">Don't have an account?</span>
        <button id="toggle-mode" type="button">Sign up</button>
      </p>
    </div>
  </div>

  <footer>
    <div class="container">&copy; <span id="year"></span> Urban Threads.</div>
  </footer>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
